name: Archive forecast

# Once a day, store the published forecast and the handicappers' ratings on the forecast-archive
# branch. The site reads that branch to show how the race has moved (/changes).
on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive-forecast
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: app
      - uses: actions/checkout@v4
        with:
          ref: forecast-archive
          path: archive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Archive today's run
        run: node app/scripts/archive-run.mjs archive "${{ vars.MODEL_URL || 'https://midterm-pulse-2026.vercel.app/api/model' }}"
      - name: Commit
        working-directory: archive
        run: |
          git config user.name "midterm-pulse-archive"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Archive forecast $(date -u +%F)"
          git push
